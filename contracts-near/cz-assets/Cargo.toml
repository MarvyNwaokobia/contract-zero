[package]
name = "cz-assets"
version = "0.1.0"
edition = "2021"
description = "CONTRACT ZERO cz-assets"
repository = "https://github.com/Psalmuel01/contract-zero"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "5", default-features = false } # no wee_alloc (RUSTSEC-2022-0054)

[dev-dependencies]
near-sdk = { version = "5", default-features = false, features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

